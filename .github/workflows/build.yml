name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and test
        run: make test

      - name: Release binaries
        run: make release

      # The CI Windows runner is an admin, so install.ps1 passes there even
      # with a symlink. A normal user gets "cannot unpack memstate-mcp.tar.gz".
      - name: Bundle has no symlinks
        run: |
          if tar -tvzf dist/memstate-mcp.tar.gz | grep '^l'; then
            echo "memstate-mcp.tar.gz has symlinks. tar.exe on Windows cannot unpack them without admin rights." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: memstated-binaries
          path: dist/*

  # The Makefile must work without bash: this job runs its cmd.exe recipes
  # on a native Windows runner. `make test` is not run here yet.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install GNU make
        run: choco install make --no-progress -y

      - name: make build
        run: make build

      - name: make install
        run: make install

      - name: make uninstall
        run: make uninstall

      - name: make release
        run: make release

      - name: make clean
        run: make clean

  # The install scripts run against the assets of this build. A local HTTP
  # server holds the `make release` output, and HOME (USERPROFILE and
  # LOCALAPPDATA on Windows) is a scratch directory. Each script runs twice
  # in its documented form (curl | bash, irm | iex): the second run must
  # leave the same state. These runs test the files that a tag push is about
  # to publish, so the release job waits for them.
  install-scripts:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: memstated-binaries
          path: dist

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist >/dev/null 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 0.2; done
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.claude"
          unset XDG_DATA_HOME MEMSTATE_ADDR
          export MEMSTATE_DOWNLOAD_URL=http://127.0.0.1:8000 MEMSTATE_SETUP=0 MEMSTATE_INSTALL_SKILL=1
          cat install.sh | bash
          cat install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          memstated --help >/dev/null 2>&1
          memstate --help >/dev/null 2>&1
          MEMSTATE_DB="$RUNNER_TEMP/smoke/memstate.db" MEMSTATE_NO_UPDATE_CHECK=1 memstate-mcp --test
          test -f "$HOME/.claude/skills/memstate/SKILL.md"
          test -f "$HOME/.claude/skills/memstate-precompact/SKILL.md"
          python3 - bash <<'EOF'
          import json, os, subprocess, sys
          settings = json.load(open(os.path.join(os.path.expanduser("~"), ".claude", "settings.json")))
          commands = [h["command"] for e in settings["hooks"]["UserPromptSubmit"] for h in e["hooks"]]
          assert len(commands) == 2, commands
          for command in commands:
              subprocess.run([sys.argv[1], "-c", command], input=b"{}", check=True)
          print("hooks ok:", commands)
          EOF

      # Windows PowerShell 5.1 is the shell that `irm | iex` usually runs in.
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8000', '--bind', '127.0.0.1', '--directory', 'dist' -NoNewWindow -PassThru
          try {
            foreach ($i in 1..50) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/ | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
            }
            $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home'
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'localappdata'
            New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.claude'), $env:LOCALAPPDATA | Out-Null
            Remove-Item Env:MEMSTATE_ADDR -ErrorAction SilentlyContinue
            $env:MEMSTATE_DOWNLOAD_URL = 'http://127.0.0.1:8000'
            $env:MEMSTATE_SETUP = '0'
            $env:MEMSTATE_INSTALL_SKILL = '1'
            Get-Content -Raw install.ps1 | Invoke-Expression
            Get-Content -Raw install.ps1 | Invoke-Expression
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          $serverDir = Join-Path $env:LOCALAPPDATA 'Programs\memstate\server'
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (@($userPath -split ';') -notcontains $serverDir) { throw "the user PATH does not have $serverDir" }
          $env:Path = "$serverDir;$env:Path"
          cmd /c "memstated --help >NUL 2>&1"
          if ($LASTEXITCODE -ne 0) { throw 'memstated --help failed' }
          cmd /c "memstate --help >NUL 2>&1"
          if ($LASTEXITCODE -ne 0) { throw 'memstate --help failed' }
          $env:MEMSTATE_DB = Join-Path $env:RUNNER_TEMP 'smoke\memstate.db'
          $env:MEMSTATE_NO_UPDATE_CHECK = '1'
          cmd /c "memstate-mcp --test 2>&1"
          if ($LASTEXITCODE -ne 0) { throw 'memstate-mcp --test failed' }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.claude\skills\memstate\SKILL.md'))) { throw 'SKILL.md is missing' }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.claude\skills\memstate-precompact\SKILL.md'))) { throw 'precompact SKILL.md is missing' }
          @'
          import json, os, subprocess, sys
          settings = json.load(open(os.path.join(os.path.expanduser("~"), ".claude", "settings.json")))
          commands = [h["command"] for e in settings["hooks"]["UserPromptSubmit"] for h in e["hooks"]]
          assert len(commands) == 2, commands
          for command in commands:
              subprocess.run([sys.argv[1], "-c", command], input=b"{}", check=True)
          print("hooks ok:", commands)
          '@ | python - 'C:\Program Files\Git\bin\bash.exe'
          if ($LASTEXITCODE -ne 0) { throw 'the hook check failed' }

      # The script of this commit installs the latest GitHub release, with no
      # test seam, the same as a user who runs the documented command now. The
      # script's own --test check is the assertion. A tag push skips this step:
      # the latest release is then still the previous one, and a script that
      # needs a file of the new release would stop the release that adds it.
      - name: install.sh, latest release
        if: runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home-latest"
          mkdir -p "$HOME/.claude"
          unset XDG_DATA_HOME MEMSTATE_ADDR
          export MEMSTATE_SETUP=0 MEMSTATE_INSTALL_SKILL=1
          cat install.sh | bash

      - name: install.ps1, latest release
        if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home-latest'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'localappdata-latest'
          New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.claude'), $env:LOCALAPPDATA | Out-Null
          Remove-Item Env:MEMSTATE_ADDR -ErrorAction SilentlyContinue
          $env:MEMSTATE_SETUP = '0'
          $env:MEMSTATE_INSTALL_SKILL = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression

  # Tag pushes (vX.Y.Z) additionally publish a GitHub Release whose assets
  # are the raw platform binaries — `memstated upgrade` fetches them by name.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-scripts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # `make release` builds the proxy bundle with npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches healthVersion
        run: |
          V=$(sed -n 's/.*healthVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' server/main.go)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match healthVersion v$V in server/main.go" >&2
            exit 1
          fi

      - name: Release binaries
        run: make release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
